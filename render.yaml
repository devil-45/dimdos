services:
  - type: web
    name: telegram-bot
    runtime: python
    buildCommand: |
      apt-get update
      apt-get install -y chromium xvfb
      pip install -r requirements.txt
      playwright install chromium
    startCommand: xvfb-run python m.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0